name: Check and deploy Astro site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.METRIBAY_SITE_URL || 'https://metribay.com' }}
  SITE_BASE: ${{ vars.METRIBAY_SITE_BASE || '/' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          include-hidden-files: true

  package:
    if: vars.METRIBAY_PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: dist/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only built public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
          include-hidden-files: true

  deploy:
    needs: package
    if: vars.METRIBAY_PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
