<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fafaf7">
    <meta name="description" content="Metribay is a dashboard for your project metrics. In development. Check back soon.">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <title>Metribay — Your project metrics, in one place</title>
    <link rel="canonical" href="https://metribay.com/">
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/assets/metribay-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" data-theme-favicon>
    <link rel="icon" href="/assets/metribay-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" data-theme-favicon>
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Metribay">
    <meta property="og:title" content="Metribay — Your project metrics, in one place">
    <meta property="og:description" content="A dashboard for your project metrics. In development. Check back soon.">
    <meta property="og:url" content="https://metribay.com/">
    <meta property="og:image" content="https://metribay.com/assets/metribay-share.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="The Metribay icon: two coloured circles above a navy pedestal.">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="/assets/site.css">
    <script src="/assets/theme.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <header class="site-header">
        <p class="status"><span class="status-dot" aria-hidden="true"></span>In development</p>
        <button class="theme-toggle" type="button" data-theme-toggle hidden>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 4a8 8 0 0 1 0 16V4Z" fill="currentColor"/>
          </svg>
          <span data-theme-label>Dark theme</span>
        </button>
      </header>
      <main id="main" class="hero" tabindex="-1">
        <div class="hero-copy">
          <h1>Metribay<span class="brand-stop" aria-hidden="true">.</span></h1>
          <p class="lead">Your project metrics,<br>in one place.</p>
          <p class="note">We’re putting the pieces together.<br>Check back soon.</p>
        </div>
        <div class="brand-visual" aria-hidden="true">
          <img class="brand-mark brand-mark-light" src="/assets/metribay-light.svg" alt="" width="200" height="200" fetchpriority="high">
          <img class="brand-mark brand-mark-dark" src="/assets/metribay-dark.svg" alt="" width="200" height="200" fetchpriority="high">
        </div>
      </main>
      <footer class="site-footer">
        <p>metribay.com</p>
        <p>© 2026 Worbee EOOD</p>
      </footer>
    </div>
  </body>
</html>
